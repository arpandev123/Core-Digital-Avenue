<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Postcard Generator - Categorized Live News</title>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <style>
        :root {
            --primary-color: #F7DC6F; 
            --primary-hover: #F4D03F;
            --background-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 580px;
            text-align: center;
        }

        h2 { margin-top: 0; color: #D4AC0D; }
        p { font-size: 0.9em; color: #666; margin-bottom: 15px; }

        .news-box {
            background: #f4fbf7;
            border: 1px solid #d4efdf;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .news-header {
            font-size: 0.75em;
            font-weight: bold;
            color: #27ae60;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .select-group {
            margin-bottom: 12px;
        }

        .select-group label {
            font-size: 0.75em;
            color: #555;
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #a3e4d7;
            background-color: #fff;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            color: #117a65;
            cursor: pointer;
        }

        .location-weather-badge {
            display: flex;
            justify-content: space-between;
            background: #e8f8f5;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: 600;
            color: #117a65;
            margin-top: 10px;
            gap: 5px;
        }

        .news-snippet {
            font-size: 0.85em;
            color: #555;
            margin-top: 8px;
            font-style: italic;
            max-height: 80px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }

        input:focus { border-color: var(--primary-color); outline: none; }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: #333333; 
            border: none;
            padding: 14px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #FCF3CF; color: #999; cursor: not-allowed; }

        #preview-section {
            display: none; 
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed #ddd;
        }

        .postcard-preview {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .postcard-preview img {
            width: 100%; height: auto; display: block;
            background-color: #eee; min-height: 250px;
        }

        .checkbox-group {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 20px;
            background: #fffdf5;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #f2e29e;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            margin: 0;
            font-size: 0.85em;
        }

        .checkbox-group input {
            margin-right: 5px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #D4AC0D;
        }

        .hidden { display: none !important; }
        #status-message { margin-top: 20px; font-weight: bold; font-size: 0.9em; min-height: 20px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .loading { color: #D4AC0D; }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Postcard Creator</h2>
        <p>Filter live global trends by country & category to render context-aware visual postcards!</p>

        <!-- Dynamic Live News Feed Section with Category Support -->
        <div class="news-box">
            <div class="news-header">
                <span>📰 Live Categorized News Stream</span>
                <span id="news-status">Ready</span>
            </div>
            
            <div class="filter-grid">
                <div class="select-group">
                    <label for="countrySelect">1. Choose Country:</label>
                    <select id="countrySelect" onchange="fetchLiveCountryNews()">
                        <option value="au" data-lat="-35.2809" data-lon="149.1300" data-capital="Canberra, Australia">Australia 🇦🇺</option>
                        <option value="us" data-lat="38.8951" data-lon="-77.0364" data-capital="Washington D.C., USA">United States 🇺🇸</option>
                        <option value="gb" data-lat="51.5074" data-lon="-0.1278" data-capital="London, UK">United Kingdom 🇬🇧</option>
                        <option value="ca" data-lat="45.4215" data-lon="-75.6972" data-capital="Ottawa, Canada">Canada 🇨🇦</option>
                        <option value="in" data-lat="28.6139" data-lon="77.2090" data-capital="New Delhi, India">India 🇮🇳</option>
                        <option value="jp" data-lat="35.6762" data-lon="139.6503" data-capital="Tokyo, Japan">Japan 🇯🇵</option>
                        <option value="de" data-lat="52.5200" data-lon="13.4050" data-capital="Berlin, Germany">Germany 🇩🇪</option>
                        <option value="fr" data-lat="48.8566" data-lon="2.3522" data-capital="Paris, France">France 🇫🇷</option>
                    </select>
                </div>

                <div class="select-group">
                    <label for="categorySelect">2. Trend Category:</label>
                    <select id="categorySelect" onchange="fetchLiveCountryNews()">
                        <option value="all">🔥 Main / Top Trends</option>
                        <option value="TECHNOLOGY">💻 Technology & AI</option>
                        <option value="BUSINESS">📈 Business & Economy</option>
                        <option value="SCIENCE">🔬 Science & Space</option>
                        <option value="ENTERTAINMENT">🎬 Entertainment & Arts</option>
                        <option value="SPORTS">⚽ Sports & Athletics</option>
                    </select>
                </div>
            </div>

            <div class="select-group">
                <label for="headlineSelect">3. Select Live Article Headline:</label>
                <select id="headlineSelect" onchange="handleHeadlineChange()">
                    <option value="">Loading live news feed...</option>
                </select>
            </div>

            <div class="location-weather-badge">
                <span id="country-location">📍 Location: Loading...</span>
                <span id="country-weather">🌤️ Weather: Loading...</span>
            </div>

            <div class="news-snippet" id="news-snippet-text">
                Fetching latest headline details...
            </div>
        </div>

        <!-- Step 1: Generate Postcard -->
        <form id="generateForm">
            <div class="form-group">
                <label for="theme">Postcard Theme / Auto-Generated Prompt</label>
                <input type="text" id="theme" placeholder="Select a headline above..." required>
            </div>
            <button type="submit" id="generateBtn">Generate Postcard</button>
        </form>

        <div id="status-message"></div>

        <!-- Step 2: Preview & Send -->
        <div id="preview-section">
            <h3>Your Postcard Preview</h3>
            
            <div class="postcard-preview">
                <img id="generated-image" src="" alt="Generated Postcard Art">
            </div>

            <p style="margin-bottom: 15px; font-weight: bold;">How would you like to share this?</p>

            <form id="sendForm">
                <div class="checkbox-group">
                    <label><input type="checkbox" id="checkEmail" checked> 📧 Email</label>
                    <label><input type="checkbox" id="checkText"> 📱 SMS</label>
                    <label><input type="checkbox" id="checkWhatsapp"> 💬 WhatsApp</label>
                </div>

                <div class="form-group" id="emailGroup">
                    <label for="email">Recipient's Email</label>
                    <input type="email" id="email" placeholder="friend@example.com">
                </div>

                <div class="form-group hidden" id="phoneGroup">
                    <label for="phone">Recipient's Phone (SMS)</label>
                    <input type="tel" id="phone" placeholder="e.g. 0412 345 678">
                </div>

                <div class="form-group hidden" id="whatsappGroup">
                    <label for="whatsappPhone">Recipient's WhatsApp Number</label>
                    <input type="tel" id="whatsappPhone" placeholder="e.g. +61412345678">
                </div>

                <button type="submit" id="sendBtn">Send Postcard</button>
            </form>
        </div>
    </div>

    <script>
        let fetchedArticles = [];

        async function fetchLiveCountryNews() {
            const countrySelect = document.getElementById('countrySelect');
            const categorySelect = document.getElementById('categorySelect');
            const headlineSelect = document.getElementById('headlineSelect');
            const statusLabel = document.getElementById('news-status');
            const selectedOption = countrySelect.options[countrySelect.selectedIndex];

            const countryCode = countrySelect.value;
            const category = categorySelect.value;
            const lat = selectedOption.getAttribute('data-lat');
            const lon = selectedOption.getAttribute('data-lon');
            const capitalName = selectedOption.getAttribute('data-capital');

            statusLabel.textContent = "Fetching...";
            headlineSelect.innerHTML = '<option value="">Loading headlines...</option>';
            
            // Fetch Weather for selected capital
            fetchWeather(lat, lon, capitalName);

            // Construct RSS topic URL based on category selection
            let rssFeedUrl = `https://news.google.com/rss?hl=en-${countryCode}&gl=${countryCode.toUpperCase()}&ceid=${countryCode.toUpperCase()}:en`;
            
            if (category !== 'all') {
                rssFeedUrl = `https://news.google.com/rss/headlines/section/topic/${category}?hl=en-${countryCode}&gl=${countryCode.toUpperCase()}&ceid=${countryCode.toUpperCase()}:en`;
            }

            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssFeedUrl)}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    fetchedArticles = data.items;
                    headlineSelect.innerHTML = '';
                    
                    fetchedArticles.forEach((item, index) => {
                        const opt = document.createElement('option');
                        opt.value = index;
                        const cleanTitle = item.title.replace(/ - [^-]+$/, '');
                        opt.textContent = cleanTitle;
                        headlineSelect.appendChild(opt);
                    });

                    statusLabel.textContent = "Connected ✔";
                    handleHeadlineChange();
                } else {
                    throw new Error("No items returned");
                }
            } catch (err) {
                console.warn("Live RSS fetch failed, loading fallback data", err);
                statusLabel.textContent = "Fallback Active";
                useFallbackNews(countryCode, category);
            }
        }

        async function fetchWeather(lat, lon, capitalName) {
            const locationEl = document.getElementById('country-location');
            const weatherEl = document.getElementById('country-weather');

            locationEl.textContent = `📍 Location: ${capitalName}`;
            weatherEl.textContent = `🌤️ Weather: Fetching...`;

            try {
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m`);
                const weatherData = await weatherRes.json();
                
                if (weatherData && weatherData.current) {
                    const temp = weatherData.current.temperature_2m;
                    const wind = weatherData.current.wind_speed_10m;
                    weatherEl.textContent = `🌤️ ${temp}°C, Wind ${wind} km/h`;
                } else {
                    weatherEl.textContent = `🌤️ Climate: Active`;
                }
            } catch (err) {
                weatherEl.textContent = `🌤️ Weather: Live Data`;
            }
        }

        function handleHeadlineChange() {
            const headlineSelect = document.getElementById('headlineSelect');
            const snippetBox = document.getElementById('news-snippet-text');
            const themeInput = document.getElementById('theme');
            const countrySelect = document.getElementById('countrySelect');
            const categorySelect = document.getElementById('categorySelect');
            
            const countryName = countrySelect.options[countrySelect.selectedIndex].text.split(' ')[0];
            const categoryName = categorySelect.options[categorySelect.selectedIndex].text.split(' ')[1] || 'Trend';

            const idx = headlineSelect.value;
            if (idx === "" || !fetchedArticles[idx]) return;

            const article = fetchedArticles[idx];
            
            const cleanTitle = article.title.replace(/ - [^-]+$/, '');
            const rawDescription = article.description || article.content || cleanTitle;
            const cleanSnippet = rawDescription.replace(/<[^>]*>?/gm, '');

            snippetBox.textContent = cleanSnippet.length > 150 ? cleanSnippet.substring(0, 150) + "..." : cleanSnippet;
            
            // Prompt format tuned for visual composition based on category
            themeInput.value = `A fine art postcard illustrating ${cleanTitle} set in ${countryName}, ${categoryName} theme, digital painting style`;
        }

        function useFallbackNews(countryCode, category) {
            const fallbackMap = {
                TECHNOLOGY: [{ title: "Breakthrough AI Architecture Unveiled at Global Summit", description: "Engineers present dynamic models improving processing speeds and energy efficiency." }],
                BUSINESS: [{ title: "Markets React as New Sustainable Infrastructure Fund Launches", description: "Major global institutions signal increased funding for smart city transport projects." }],
                SCIENCE: [{ title: "Deep Space Telescope Detects Unprecedented Atmospheric Signals", description: "Astronomers publish initial readings from recent interstellar observations." }],
                default: [{ title: "Global Innovation Conference Focuses on Clean Energy", description: "Delegates showcase sustainable engineering solutions across public infrastructure." }]
            };

            fetchedArticles = fallbackMap[category] || fallbackMap['default'];
            const headlineSelect = document.getElementById('headlineSelect');
            headlineSelect.innerHTML = '';
            
            fetchedArticles.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = item.title;
                headlineSelect.appendChild(opt);
            });
            handleHeadlineChange();
        }

        window.addEventListener('DOMContentLoaded', fetchLiveCountryNews);

        // Core App Logic
        const generateForm = document.getElementById('generateForm');
        const sendForm = document.getElementById('sendForm');
        const previewSection = document.getElementById('preview-section');
        const statusMessage = document.getElementById('status-message');
        
        const checkEmail = document.getElementById('checkEmail');
        const checkText = document.getElementById('checkText');
        const checkWhatsapp = document.getElementById('checkWhatsapp');
        
        const emailGroup = document.getElementById('emailGroup');
        const phoneGroup = document.getElementById('phoneGroup');
        const whatsappGroup = document.getElementById('whatsappGroup');
        
        const sendBtn = document.getElementById('sendBtn');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const whatsappInput = document.getElementById('whatsappPhone');

        let currentTheme = "";

        function updateFormUI() {
            emailGroup.classList.toggle('hidden', !checkEmail.checked);
            phoneGroup.classList.toggle('hidden', !checkText.checked);
            whatsappGroup.classList.toggle('hidden', !checkWhatsapp.checked);
            
            emailInput.required = checkEmail.checked;
            phoneInput.required = checkText.checked;
            whatsappInput.required = checkWhatsapp.checked;
            
            const activeCount = [checkEmail.checked, checkText.checked, checkWhatsapp.checked].filter(Boolean).length;
            
            if (activeCount === 0) {
                sendBtn.textContent = 'Select an option above';
                sendBtn.disabled = true;
            } else if (activeCount > 1) {
                sendBtn.textContent = 'Send via Multiple Channels';
                sendBtn.disabled = false;
            } else {
                if (checkEmail.checked) sendBtn.textContent = 'Send Email';
                if (checkText.checked) sendBtn.textContent = 'Send SMS';
                if (checkWhatsapp.checked) sendBtn.textContent = 'Share via WhatsApp';
                sendBtn.disabled = false;
            }
        }

        checkEmail.addEventListener('change', updateFormUI);
        checkText.addEventListener('change', updateFormUI);
        checkWhatsapp.addEventListener('change', updateFormUI);

        generateForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            currentTheme = document.getElementById('theme').value;
            const generateBtn = document.getElementById('generateBtn');

            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating Art...';
            statusMessage.className = 'loading';
            statusMessage.textContent = '🎨 Rendering postcard artwork...';
            previewSection.style.display = 'none';

            try {
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(currentTheme)}?width=400&height=300&nologo=true`;
                await new Promise(resolve => setTimeout(resolve, 1200));
                
                const imgEl = document.getElementById('generated-image');
                imgEl.src = imageUrl;

                imgEl.onload = () => {
                    statusMessage.textContent = '';
                    previewSection.style.display = 'block';
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate New Postcard';
                };
            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Failed to generate postcard visual.';
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Postcard';
            }
        });

        sendForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            sendBtn.disabled = true;
            sendBtn.textContent = 'Processing...';
            statusMessage.className = 'loading';
            
            const imageUrl = document.getElementById('generated-image').src;
            let successMessage = "";
            let whatsappUrlToOpen = null;
            let smsUrlToOpen = null;

            try {
                if (checkEmail.checked) {
                    statusMessage.textContent = '✉️ Delivering email...';
                    emailjs.init("nERbog0CqlvyZi4UE");
                    await emailjs.send("service_kmmyfad", "template_wcnazr9", {
                        to_email: emailInput.value,
                        theme: currentTheme,
                        image_url: imageUrl
                    });
                    successMessage += `✨ Email sent! `;
                }

                if (checkText.checked) {
                    const phone = phoneInput.value;
                    const smsBody = `Check out this news postcard for "${currentTheme}"! View: ${imageUrl}`;
                    smsUrlToOpen = `sms:${phone}?body=${encodeURIComponent(smsBody)}`;
                    successMessage += `📱 SMS app opened! `;
                }

                if (checkWhatsapp.checked) {
                    const waPhone = whatsappInput.value.replace(/\D/g,'');
                    whatsappUrlToOpen = `https://api.whatsapp.com/send?phone=${waPhone}&text=${encodeURIComponent(imageUrl)}`;
                    successMessage += `💬 WhatsApp ready! `;
                }

                statusMessage.className = 'success';
                statusMessage.textContent = successMessage || 'Success!';
                
                if (smsUrlToOpen) {
                    setTimeout(() => { window.location.href = smsUrlToOpen; }, 400);
                }
                if (whatsappUrlToOpen) {
                    setTimeout(() => { window.open(whatsappUrlToOpen, '_blank'); }, 800);
                }

                setTimeout(() => {
                    sendForm.reset();
                    updateFormUI();
                    previewSection.style.display = 'none';
                    statusMessage.textContent = '';
                }, 4000);

            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Delivery error. Check your settings.';
                console.error(error);
                updateFormUI();
            }
        });
    </script>
</body>
</html>
