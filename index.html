<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Postcard Generator - World Country Eco-Ticker</title>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <style>
        :root {
            --primary-color: #F7DC6F; 
            --primary-hover: #F4D03F;
            --background-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        h2 { margin-top: 0; color: #D4AC0D; }
        p { font-size: 0.9em; color: #666; margin-bottom: 15px; }

        /* --- COUNTRY SELECTOR STYLES --- */
        .region-selector-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .region-selector-group label {
            font-size: 0.8em;
            font-weight: bold;
            color: #27ae60;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #a3e4d7;
            background-color: #f4fbf7;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
            color: #117a65;
            cursor: pointer;
        }

        .trending-box {
            background: #f4fbf7;
            border: 1px solid #d4efdf;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        .trending-header {
            font-size: 0.75em;
            font-weight: bold;
            color: #27ae60;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .location-weather-badge {
            display: flex;
            justify-content: space-between;
            background: #e8f8f5;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: 600;
            color: #117a65;
            margin-bottom: 8px;
            gap: 5px;
        }

        .trend-snippet {
            font-size: 0.85em;
            color: #555;
            margin-bottom: 12px;
            font-style: italic;
        }

        .trend-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .trend-chip {
            background: #e8f8f5;
            border: 1px solid #a3e4d7;
            color: #117a65;
            padding: 4px 8px;
            font-size: 0.75em;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .trend-chip:hover {
            background: #48c9b0;
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }

        input:focus { border-color: var(--primary-color); outline: none; }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: #333333; 
            border: none;
            padding: 14px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #FCF3CF; color: #999; cursor: not-allowed; }

        #preview-section {
            display: none; 
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed #ddd;
        }

        .postcard-preview {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .postcard-preview img {
            width: 100%; height: auto; display: block;
            background-color: #eee; min-height: 250px;
        }

        .checkbox-group {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 20px;
            background: #fffdf5;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #f2e29e;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            margin: 0;
            font-size: 0.85em;
        }

        .checkbox-group input {
            margin-right: 5px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #D4AC0D;
        }

        .hidden { display: none !important; }
        #status-message { margin-top: 20px; font-weight: bold; font-size: 0.9em; min-height: 20px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .loading { color: #D4AC0D; }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Postcard Creator</h2>
        <p>Select any country worldwide to fetch live weather & regional landmarks!</p>

        <!-- Dynamic Country Dropdown -->
        <div class="region-selector-group">
            <label for="countrySelect">🌐 Select Country</label>
            <select id="countrySelect" onchange="switchCountry()">
                <option value="">Loading countries list...</option>
            </select>
        </div>

        <!-- Live Climate & Location Box -->
        <div class="trending-box">
            <div class="trending-header">
                <span>🌱 Live National Feed</span>
                <span id="trend-status">Syncing...</span>
            </div>
            
            <div class="location-weather-badge">
                <span id="trend-location">📍 Capital: Loading...</span>
                <span id="trend-weather">🌤️ Weather: Loading...</span>
            </div>

            <div class="trend-snippet" id="trend-snippet-text">
                Fetching environmental conditions for selected country...
            </div>
            
            <div class="trend-chips" id="trend-chips-container">
                <!-- Dynamically injected topic chips based on selected country -->
            </div>
        </div>

        <!-- Step 1: Generate Postcard -->
        <form id="generateForm">
            <div class="form-group">
                <label for="theme">Postcard Theme / Auto-Prompt</label>
                <input type="text" id="theme" placeholder="Select a trend above or type custom theme" required>
            </div>
            <button type="submit" id="generateBtn">Generate Postcard</button>
        </form>

        <div id="status-message"></div>

        <!-- Step 2: Preview & Send -->
        <div id="preview-section">
            <h3>Your Postcard Preview</h3>
            
            <div class="postcard-preview">
                <img id="generated-image" src="" alt="Generated Postcard Art">
            </div>

            <p style="margin-bottom: 15px; font-weight: bold;">How would you like to share this?</p>

            <form id="sendForm">
                <div class="checkbox-group">
                    <label><input type="checkbox" id="checkEmail" checked> 📧 Email</label>
                    <label><input type="checkbox" id="checkText"> 📱 SMS</label>
                    <label><input type="checkbox" id="checkWhatsapp"> 💬 WhatsApp</label>
                </div>

                <div class="form-group" id="emailGroup">
                    <label for="email">Recipient's Email</label>
                    <input type="email" id="email" placeholder="friend@example.com">
                </div>

                <div class="form-group hidden" id="phoneGroup">
                    <label for="phone">Recipient's Phone (SMS)</label>
                    <input type="tel" id="phone" placeholder="e.g. 0412 345 678">
                </div>

                <div class="form-group hidden" id="whatsappGroup">
                    <label for="whatsappPhone">Recipient's WhatsApp Number</label>
                    <input type="tel" id="whatsappPhone" placeholder="e.g. +61412345678">
                </div>

                <button type="submit" id="sendBtn">Send Postcard</button>
            </form>
        </div>
    </div>

    <script>
        let allCountriesData = [];

        // Fetch all countries from REST Countries API on startup and populate dropdown alphabetically
        async function fetchCountries() {
            const selectEl = document.getElementById('countrySelect');
            try {
                const response = await fetch('https://restcountries.com/v3.1/all?fields=name,capital,latlng,region');
                const data = await response.json();
                
                // Filter and map countries that have capital coordinates
                allCountriesData = data
                    .filter(c => c.capital && c.latlng && c.latlng.length >= 2)
                    .map(c => ({
                        name: c.name.common,
                        capital: c.capital[0],
                        lat: c.latlng[0],
                        lon: c.latlng[1],
                        region: c.region
                    }))
                    .sort((a, b) => a.name.localeCompare(b.name));

                selectEl.innerHTML = '';
                
                allCountriesData.forEach((country, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.textContent = `${country.name} (Capital: ${country.capital})`;
                    selectEl.appendChild(opt);
                });

                // Default selection to Australia if present, otherwise first item
                const ausIndex = allCountriesData.findIndex(c => c.name === "Australia");
                selectEl.value = ausIndex !== -1 ? ausIndex : 0;

                switchCountry();
            } catch (err) {
                selectEl.innerHTML = '<option value="">Failed to load countries. Refresh page.</option>';
                console.error("Error fetching countries:", err);
            }
        }

        async function switchCountry() {
            const selectEl = document.getElementById('countrySelect');
            const idx = selectEl.value;
            if (idx === "" || !allCountriesData[idx]) return;

            const country = allCountriesData[idx];

            const statusSpan = document.getElementById('trend-status');
            const locationEl = document.getElementById('trend-location');
            const weatherEl = document.getElementById('trend-weather');
            const snippetBox = document.getElementById('trend-snippet-text');
            const chipsContainer = document.getElementById('trend-chips-container');

            statusSpan.textContent = 'Syncing...';
            locationEl.textContent = `📍 ${country.capital}, ${country.name}`;
            snippetBox.textContent = `Observing ecological and seasonal landscapes across ${country.name}...`;
            chipsContainer.innerHTML = '';

            // Fetch live weather from Open-Meteo for the selected country's capital coordinates
            try {
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${country.lat}&longitude=${country.lon}&current=temperature_2m,weather_code,wind_speed_10m`);
                const weatherData = await weatherRes.json();
                
                if (weatherData && weatherData.current) {
                    const temp = weatherData.current.temperature_2m;
                    const wind = weatherData.current.wind_speed_10m;
                    weatherEl.textContent = `🌤️ ${temp}°C, Wind ${wind} km/h`;
                    statusSpan.textContent = 'Live Synced ✔';
                } else {
                    weatherEl.textContent = `🌤️ Climate: Stable`;
                    statusSpan.textContent = 'Synced ✔';
                }
            } catch (err) {
                weatherEl.textContent = `🌤️ Climate: Seasonal Norms`;
                statusSpan.textContent = 'Active Feed';
            }

            // Generate contextual dynamic topic chips based on country details
            const topics = [
                { title: `${country.capital} Landmark View`, prompt: `A breathtaking architectural and scenic postcard view of ${country.capital}, ${country.name} during golden hour` },
                { title: `Natural Biosphere of ${country.name}`, prompt: `A pristine and vibrant natural wildlife and wilderness landscape characteristic of ${country.name}` },
                { title: `Scenic Horizon of ${country.name}`, prompt: `A stunning panoramic landscape horizon showing the unique terrain and nature of ${country.name}` }
            ];

            topics.forEach(t => {
                const chip = document.createElement('div');
                chip.className = 'trend-chip';
                chip.textContent = `# ${t.title}`;
                chip.onclick = () => {
                    document.getElementById('theme').value = t.prompt;
                    snippetBox.textContent = `Focus: ${t.title} (${country.name})`;
                    document.getElementById('generateForm').requestSubmit();
                };
                chipsContainer.appendChild(chip);
            });
        }

        // Initialize country list on load
        window.addEventListener('DOMContentLoaded', fetchCountries);

        // Standard App Logic
        const generateForm = document.getElementById('generateForm');
        const sendForm = document.getElementById('sendForm');
        const previewSection = document.getElementById('preview-section');
        const statusMessage = document.getElementById('status-message');
        
        const checkEmail = document.getElementById('checkEmail');
        const checkText = document.getElementById('checkText');
        const checkWhatsapp = document.getElementById('checkWhatsapp');
        
        const emailGroup = document.getElementById('emailGroup');
        const phoneGroup = document.getElementById('phoneGroup');
        const whatsappGroup = document.getElementById('whatsappGroup');
        
        const sendBtn = document.getElementById('sendBtn');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const whatsappInput = document.getElementById('whatsappPhone');

        let currentTheme = "";

        function updateFormUI() {
            emailGroup.classList.toggle('hidden', !checkEmail.checked);
            phoneGroup.classList.toggle('hidden', !checkText.checked);
            whatsappGroup.classList.toggle('hidden', !checkWhatsapp.checked);
            
            emailInput.required = checkEmail.checked;
            phoneInput.required = checkText.checked;
            whatsappInput.required = checkWhatsapp.checked;
            
            const activeCount = [checkEmail.checked, checkText.checked, checkWhatsapp.checked].filter(Boolean).length;
            
            if (activeCount === 0) {
                sendBtn.textContent = 'Select an option above';
                sendBtn.disabled = true;
            } else if (activeCount > 1) {
                sendBtn.textContent = 'Send via Multiple Channels';
                sendBtn.disabled = false;
            } else {
                if (checkEmail.checked) sendBtn.textContent = 'Send Email';
                if (checkText.checked) sendBtn.textContent = 'Send SMS';
                if (checkWhatsapp.checked) sendBtn.textContent = 'Share via WhatsApp';
                sendBtn.disabled = false;
            }
        }

        checkEmail.addEventListener('change', updateFormUI);
        checkText.addEventListener('change', updateFormUI);
        checkWhatsapp.addEventListener('change', updateFormUI);

        generateForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            currentTheme = document.getElementById('theme').value;
            const generateBtn = document.getElementById('generateBtn');

            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating Art...';
            statusMessage.className = 'loading';
            statusMessage.textContent = '🌿 Painting regional nature postcard...';
            previewSection.style.display = 'none';

            try {
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(currentTheme + " postcard illustration")}?width=400&height=300&nologo=true`;
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                document.getElementById('generated-image').src = imageUrl;

                document.getElementById('generated-image').onload = () => {
                    statusMessage.textContent = '';
                    previewSection.style.display = 'block';
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate New Postcard';
                };
            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Failed to generate postcard.';
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Postcard';
            }
        });

        sendForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            sendBtn.disabled = true;
            sendBtn.textContent = 'Processing...';
            statusMessage.className = 'loading';
            
            const imageUrl = document.getElementById('generated-image').src;
            let successMessage = "";
            let whatsappUrlToOpen = null;
            let smsUrlToOpen = null;

            try {
                if (checkEmail.checked) {
                    statusMessage.textContent = '✉️ Delivering email...';
                    emailjs.init("nERbog0CqlvyZi4UE");
                    await emailjs.send("service_kmmyfad", "template_wcnazr9", {
                        to_email: emailInput.value,
                        theme: currentTheme,
                        image_url: imageUrl
                    });
                    successMessage += `✨ Email sent! `;
                }

                if (checkText.checked) {
                    const phone = phoneInput.value;
                    const smsBody = `Check out this postcard about "${currentTheme}"! View: ${imageUrl}`;
                    smsUrlToOpen = `sms:${phone}?body=${encodeURIComponent(smsBody)}`;
                    successMessage += `📱 SMS app opened! `;
                }

                if (checkWhatsapp.checked) {
                    const waPhone = whatsappInput.value.replace(/\D/g,'');
                    whatsappUrlToOpen = `https://api.whatsapp.com/send?phone=${waPhone}&text=${encodeURIComponent(imageUrl)}`;
                    successMessage += `💬 WhatsApp ready! `;
                }

                statusMessage.className = 'success';
                statusMessage.textContent = successMessage || 'Success!';
                
                if (smsUrlToOpen) {
                    setTimeout(() => { window.location.href = smsUrlToOpen; }, 400);
                }
                if (whatsappUrlToOpen) {
                    setTimeout(() => { window.open(whatsappUrlToOpen, '_blank'); }, 800);
                }

                setTimeout(() => {
                    sendForm.reset();
                    updateFormUI();
                    previewSection.style.display = 'none';
                    document.getElementById('theme').value = '';
                    statusMessage.textContent = '';
                }, 4000);

            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Something went wrong. Check your settings.';
                console.error(error);
                updateFormUI();
            }
        });
    </script>
</body>
</html>
