<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Postcard Generator</title>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <style>
        :root {
            /* Light Yellow Theme */
            --primary-color: #F7DC6F; 
            --primary-hover: #F4D03F;
            --background-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 { margin-top: 0; color: #D4AC0D; }
        p { font-size: 0.95em; color: #666; margin-bottom: 25px; }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--primary-color); outline: none; }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: #333333; 
            border: none;
            padding: 14px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #FCF3CF; color: #999; cursor: not-allowed; }

        /* Postcard Preview Styles */
        #preview-section {
            display: none; 
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed #ddd;
        }

        .postcard-preview {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .postcard-preview img {
            width: 100%; height: auto; display: block;
            background-color: #eee; min-height: 250px;
        }

        /* Checkbox & Dynamic UI Styles */
        .checkbox-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            background: #fffdf5;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #f2e29e;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            margin: 0;
            color: #333;
        }

        .checkbox-group input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #D4AC0D;
        }

        .hidden { display: none !important; }
        
        #status-message {
            margin-top: 20px; font-weight: bold; font-size: 0.9em; min-height: 20px;
        }

        .success { color: #28a745; }
        .error { color: #dc3545; }
        .loading { color: #D4AC0D; }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Postcard Creator</h2>
        <p>Step 1: Enter a theme to generate your postcard artwork.</p>

        <!-- Step 1: Generate Postcard -->
        <form id="generateForm">
            <div class="form-group">
                <label for="theme">Postcard Theme</label>
                <input type="text" id="theme" placeholder="e.g., A futuristic city at sunset" required>
            </div>
            <button type="submit" id="generateBtn">Generate Postcard</button>
        </form>

        <div id="status-message"></div>

        <!-- Step 2: Preview & Send -->
        <div id="preview-section">
            <h3>Your Postcard Preview</h3>
            
            <div class="postcard-preview">
                <img id="generated-image" src="" alt="Generated Postcard Art">
            </div>

            <p style="margin-bottom: 15px; font-weight: bold;">How would you like to send this?</p>

            <form id="sendForm">
                
                <!-- The User Choice Checkboxes -->
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="checkEmail" checked> 📧 Email
                    </label>
                    <label>
                        <input type="checkbox" id="checkText"> 📱 Text
                    </label>
                </div>

                <!-- Dynamic Email Input -->
                <div class="form-group" id="emailGroup">
                    <label for="email">Recipient's Email</label>
                    <input type="email" id="email" placeholder="friend@example.com">
                </div>

                <!-- Dynamic Phone Input -->
                <div class="form-group hidden" id="phoneGroup">
                    <label for="phone">Recipient's Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. 0412 345 678">
                </div>

                <button type="submit" id="sendBtn">Send Email</button>
            </form>
        </div>
    </div>

    <script>
        // Form & UI Elements
        const generateForm = document.getElementById('generateForm');
        const sendForm = document.getElementById('sendForm');
        const previewSection = document.getElementById('preview-section');
        const statusMessage = document.getElementById('status-message');
        
        const checkEmail = document.getElementById('checkEmail');
        const checkText = document.getElementById('checkText');
        const emailGroup = document.getElementById('emailGroup');
        const phoneGroup = document.getElementById('phoneGroup');
        const sendBtn = document.getElementById('sendBtn');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');

        let currentTheme = "";

        // --- DYNAMIC UI LOGIC ---
        // This function updates the inputs and button text based on checkboxes
        function updateFormUI() {
            // Show/hide fields
            emailGroup.classList.toggle('hidden', !checkEmail.checked);
            phoneGroup.classList.toggle('hidden', !checkText.checked);
            
            // Set required fields based on selection
            emailInput.required = checkEmail.checked;
            phoneInput.required = checkText.checked;
            
            // Update the button text
            if (checkEmail.checked && checkText.checked) {
                sendBtn.textContent = 'Send Email & Text';
                sendBtn.disabled = false;
            } else if (checkEmail.checked) {
                sendBtn.textContent = 'Send Email';
                sendBtn.disabled = false;
            } else if (checkText.checked) {
                sendBtn.textContent = 'Send Text';
                sendBtn.disabled = false;
            } else {
                sendBtn.textContent = 'Select an option above';
                sendBtn.disabled = true;
            }
        }

        // Listen for checkbox clicks
        checkEmail.addEventListener('change', updateFormUI);
        checkText.addEventListener('change', updateFormUI);

        // --- STEP 1: GENERATE ---
        generateForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            currentTheme = document.getElementById('theme').value;
            const generateBtn = document.getElementById('generateBtn');

            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating Art...';
            statusMessage.className = 'loading';
            statusMessage.textContent = '🎨 Painting your masterpiece...';
            previewSection.style.display = 'none';

            try {
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(currentTheme + " postcard illustration")}?width=400&height=300&nologo=true`;
                
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                document.getElementById('generated-image').src = imageUrl;

                document.getElementById('generated-image').onload = () => {
                    statusMessage.textContent = '';
                    previewSection.style.display = 'block';
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate New Postcard';
                };
            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Failed to generate postcard.';
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Postcard';
            }
        });

        // --- STEP 2: SEND EMAIL, TEXT, OR BOTH ---
        sendForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            statusMessage.className = 'loading';
            
            const imageUrl = document.getElementById('generated-image').src;
            let successMessage = "";

            try {
                // ACTION A: Send Email via EmailJS
                if (checkEmail.checked) {
                    statusMessage.textContent = '✉️ Delivering email...';
                    
                    // REPLACE THESE WITH YOUR KEYS!
                    emailjs.init("nERbog0CqlvyZi4UE");
                    await emailjs.send("service_kmmyfad", "template_wcnazr9", {
                        to_email: emailInput.value,
                        theme: currentTheme,
                        image_url: imageUrl
                    });
                    
                    successMessage += `✨ Email sent to ${emailInput.value}! `;
                }

                // ACTION B: Send Text via Native SMS App
                if (checkText.checked) {
                    const phone = phoneInput.value;
                    const smsBody = `I made a digital postcard about "${currentTheme}" for you! View it here: ${imageUrl}`;
                    
                    // This launches the phone's native texting app
                    const smsUrl = `sms:${phone}?body=${encodeURIComponent(smsBody)}`;
                    
                    // Small delay to ensure EmailJS finishes before opening the texting app
                    setTimeout(() => {
                        window.location.href = smsUrl;
                    }, 500);

                    successMessage += `📱 Text message app opened!`;
                }

                // Reset Success UI
                statusMessage.className = 'success';
                statusMessage.textContent = successMessage;
                
                setTimeout(() => {
                    sendForm.reset();
                    updateFormUI(); // Reset UI back to default state
                    previewSection.style.display = 'none';
                    document.getElementById('theme').value = '';
                    statusMessage.textContent = '';
                }, 4000);

            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Something went wrong. Check your EmailJS setup.';
                console.error(error);
                updateFormUI(); // Re-enable button
            }
        });
    </script>
</body>
</html>
