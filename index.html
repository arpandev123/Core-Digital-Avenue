<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
        signOut, onAuthStateChanged, deleteUser 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
        getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // -------------------------------------------------------------------------
    // 1. CONFIGURATION AREA - REPLACE WITH YOUR PROJECT DETAILS
    // -------------------------------------------------------------------------

    const firebaseConfig = {
        apiKey: "AIzaSyAP07ZvMQCdA2IL-WDve02qXO5WKYXyfuw",
        authDomain: "cdasignup.firebaseapp.com",
        projectId: "cdasignup",
        storageBucket: "cdasignup.firebasestorage.app",
        messagingSenderId: "895237120356",
        appId: "1:895237120356:web:487f649776f6f530f3da71"
    };

    const STRIPE_LINKS = {
        tier2: "https://buy.stripe.com/28EeVcbHKbZl7WM2uqbMQ01",
        tier3: "https://buy.stripe.com/aFabJ01365AX3Gw0mibMQ00"
    };

    // Initialize Firebase Services
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let fetchedArticles = [];
    let loadedUserImage = null;

    const keywordMap = {
        ECO: ["climate", "nature", "earth", "ocean", "forest", "environment", "conservation", "eco"],
        SUPPLY_CHAIN: ["supply chain", "logistics", "shipping", "freight", "ports", "inventory", "resilience"],
        MANUFACTURING: ["manufacturing", "factory", "industrial production", "automation", "assembly line", "machinery"],
        RARE_EARTH: ["rare earth", "critical minerals", "lithium", "cobalt", "neodymium", "rare earth elements", "mining"],
        MATERIALS: ["advanced materials", "steel", "aluminum", "semiconductors", "composites", "raw materials"]
    };

    // -------------------------------------------------------------------------
    // 2. AUTHENTICATION & DATABASE SYNC LOGIC
    // -------------------------------------------------------------------------

    // Helper functions for strict visibility control
    function showAuthModal() {
        document.getElementById('authOverlay').classList.remove('hidden');
        document.getElementById('pricingOverlay').classList.add('hidden');
        document.querySelector('.container').classList.add('hidden');
    }

    function showPricingModal() {
        document.getElementById('authOverlay').classList.add('hidden');
        document.getElementById('pricingOverlay').classList.remove('hidden');
        document.querySelector('.container').classList.add('hidden');
    }

    function showMainApp() {
        document.getElementById('authOverlay').classList.add('hidden');
        document.getElementById('pricingOverlay').classList.add('hidden');
        document.querySelector('.container').classList.remove('hidden');
    }

    // AUTHENTICATION STATE OBSERVER
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            try {
                const userRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(userRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();

                    if (data.status === 'deactivated') {
                        alert("Your account is deactivated. Contact support to reactivate.");
                        await signOut(auth);
                        showAuthModal();
                        return;
                    }

                    document.getElementById('user-display-name').textContent = `👤 ${data.fullName || user.email}`;
                    document.getElementById('user-plan-badge').textContent = `Plan: ${data.subscriptionPlan || 'Inactive'}`;

                    if (!data.subscriptionPlan || data.subscriptionPlan === 'Inactive') {
                        showPricingModal();
                    } else {
                        // User is verified, active, and subscribed
                        showMainApp();
                        fetchLiveCountryNews();
                    }
                } else {
                    // Fallback if Firestore doc is missing
                    showPricingModal();
                }
            } catch (err) {
                console.error("Auth sync error:", err);
                showAuthModal();
            }
        } else {
            currentUser = null;
            showAuthModal();
        }
    });

    // USER AUTH ACTIONS
    window.handleSignUp = async (e) => {
        e.preventDefault();
        const name = document.getElementById('signUpName').value;
        const email = document.getElementById('signUpEmail').value;
        const password = document.getElementById('signUpPassword').value;

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            await setDoc(doc(db, "users", userCredential.user.uid), {
                uid: userCredential.user.uid,
                fullName: name,
                email: email,
                subscriptionPlan: "Inactive",
                status: "active",
                createdAt: new Date().toISOString()
            });
        } catch (error) {
            alert(`Sign Up Error: ${error.message}`);
        }
    };

    window.handleLogin = async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            alert(`Login Error: ${error.message}`);
        }
    };

    window.handleLogout = async () => {
        await signOut(auth);
        showAuthModal();
    };

    window.deactivateAccount = async () => {
        if (!currentUser || !confirm("Deactivate your account? You will be logged out.")) return;
        try {
            await updateDoc(doc(db, "users", currentUser.uid), { status: "deactivated" });
            await signOut(auth);
            showAuthModal();
        } catch (error) {
            alert(`Error: ${error.message}`);
        }
    };

    window.deleteAccountPermanently = async () => {
        if (!currentUser || !confirm("PERMANENT DELETE: This erases your database profile and login access completely. Proceed?")) return;
        try {
            const uid = currentUser.uid;
            await deleteDoc(doc(db, "users", uid));
            await deleteUser(currentUser);
            alert("Account deleted.");
            showAuthModal();
        } catch (error) {
            alert(`Deletion failed. Log out and back in, then retry: ${error.message}`);
        }
    };

    window.activateSubscriptionInDB = async (planName) => {
        if (!currentUser) return;
        try {
            await updateDoc(doc(db, "users", currentUser.uid), { subscriptionPlan: planName });
            document.getElementById('user-plan-badge').textContent = `Plan: ${planName}`;
            showMainApp();
            fetchLiveCountryNews();
        } catch (error) {
            alert(`Database update failed: ${error.message}`);
        }
    };

    window.redirectToStripe = (tierKey) => {
        const link = STRIPE_LINKS[tierKey];
        if (!link || link.includes('YOUR_ACTUAL_TIER')) {
            alert("Replace placeholder Stripe URLs in the JS source code with your actual Payment Links.");
            return;
        }
        window.location.href = link;
    };

    window.showTab = (tab) => {
        document.getElementById('loginTab').classList.toggle('hidden', tab !== 'login');
        document.getElementById('signUpTab').classList.toggle('hidden', tab !== 'signup');
    };

    window.toggleSettingsMenu = () => {
        document.getElementById('accountSettingsMenu').classList.toggle('hidden');
    };

    window.toggleCustomEnquiry = () => {
        const box = document.getElementById('customEnquiryBox');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    };

    // -------------------------------------------------------------------------
    // 3. NEWS FEED & GENERATOR LOGIC
    // -------------------------------------------------------------------------

    async function fetchLiveCountryNews() {
        const countrySelect = document.getElementById('countrySelect');
        const categorySelect = document.getElementById('categorySelect');
        const headlineSelect = document.getElementById('headlineSelect');
        const statusLabel = document.getElementById('news-status');
        const selectedOpt = countrySelect.options[countrySelect.selectedIndex];

        const countryCode = countrySelect.value;
        const category = categorySelect.value;
        const lat = selectedOpt.getAttribute('data-lat');
        const lon = selectedOpt.getAttribute('data-lon');
        const capitalName = selectedOpt.getAttribute('data-capital');

        statusLabel.textContent = "Fetching...";
        headlineSelect.innerHTML = '<option value="">Loading headlines...</option>';
        
        fetchWeather(lat, lon, capitalName);

        let rssUrl = "";

        if (keywordMap[category]) {
            const queryStr = keywordMap[category].slice(0, 6).map(k => `"${k}"`).join(" OR ");
            rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(queryStr)}&hl=en-${countryCode}&gl=${countryCode.toUpperCase()}&ceid=${countryCode.toUpperCase()}:en`;
        } else if (category !== 'all') {
            rssUrl = `https://news.google.com/rss/headlines/section/topic/${category}?hl=en-${countryCode}&gl=${countryCode.toUpperCase()}&ceid=${countryCode.toUpperCase()}:en`;
        } else {
            rssUrl = `https://news.google.com/rss?hl=en-${countryCode}&gl=${countryCode.toUpperCase()}&ceid=${countryCode.toUpperCase()}:en`;
        }

        try {
            const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
            const data = await res.json();
            if (data.status === 'ok' && data.items && data.items.length > 0) {
                fetchedArticles = data.items;
                headlineSelect.innerHTML = '';
                
                fetchedArticles.forEach((item, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.textContent = item.title.replace(/ - [^-]+$/, '');
                    headlineSelect.appendChild(opt);
                });

                statusLabel.textContent = "Connected ✔";
                handleHeadlineChange();
            } else {
                throw new Error("No items returned");
            }
        } catch (err) {
            statusLabel.textContent = "Fallback Active";
            useFallbackNews();
        }
    }

    async function fetchWeather(lat, lon, capital) {
        const weatherEl = document.getElementById('country-weather');
        document.getElementById('country-location').textContent = `📍 Location: ${capital}`;
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m`);
            const data = await res.json();
            if (data.current) {
                weatherEl.textContent = `🌤️ ${data.current.temperature_2m}°C, Wind ${data.current.wind_speed_10m} km/h`;
            }
        } catch (e) {
            weatherEl.textContent = `🌤️ Climate: Active`;
        }
    }

    function handleHeadlineChange() {
        const headlineSelect = document.getElementById('headlineSelect');
        const snippetBox = document.getElementById('news-snippet-text');
        const themeInput = document.getElementById('theme');
        const sourceLink = document.getElementById('source-link');
        
        const idx = headlineSelect.value;
        if (idx === "" || !fetchedArticles[idx]) return;

        const article = fetchedArticles[idx];
        const cleanTitle = article.title.replace(/ - [^-]+$/, '');
        const rawDescription = article.description || article.content || cleanTitle;
        const cleanSnippet = rawDescription.replace(/<[^>]*>?/gm, '');

        snippetBox.textContent = cleanSnippet.length > 150 ? cleanSnippet.substring(0, 150) + "..." : cleanSnippet;
        
        if (article.link) {
            sourceLink.href = article.link;
            sourceLink.classList.remove('disabled');
        }

        themeInput.value = `A scenic postcard showing ${cleanTitle}, high quality photo, vibrant colors`;
    }

    function toggleImageSourceMode() {
        const isAi = document.querySelector('input[name="imageSourceMode"]:checked').value === 'ai';
        document.getElementById('aiPromptGroup').classList.toggle('hidden', !isAi);
        document.getElementById('deviceUploadGroup').classList.toggle('hidden', isAi);
        document.getElementById('theme').required = isAi;
        document.getElementById('imageFileInput').required = !isAi;
    }

    function handleDeviceFileSelect(event) {
        const file = event.target.files[0];
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => { loadedUserImage = img; };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            loadedUserImage = null;
        }
    }

    function processPhotoToArt(style) {
        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');
        const maxDim = 800;
        let width = loadedUserImage.width;
        let height = loadedUserImage.height;

        if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
            else { width = Math.round((width * maxDim) / height); height = maxDim; }
        }

        canvas.width = width; canvas.height = height;
        ctx.filter = style === 'ghibli' ? 'saturate(180%) contrast(115%) sepia(15%)' : 
                    style === 'posterize' ? 'saturate(200%) contrast(140%)' :
                    style === 'sketch' ? 'grayscale(100%) contrast(200%)' : 'none';
        ctx.drawImage(loadedUserImage, 0, 0, width, height);
        return canvas.toDataURL('image/jpeg', 0.9);
    }

    function useFallbackNews() {
        fetchedArticles = [{ title: "Global Materials processing milestone achieved", description: "Strategic investment accelerates sustainable infrastructure transformation.", link: "https://news.google.com" }];
        const headlineSelect = document.getElementById('headlineSelect');
        headlineSelect.innerHTML = '<option value="0">Global Materials processing milestone achieved</option>';
        handleHeadlineChange();
    }

    function generatePostcardVisual(e) {
        e.preventDefault();
        const isAi = document.querySelector('input[name="imageSourceMode"]:checked').value === 'ai';
        const imgEl = document.getElementById('generated-image');
        const status = document.getElementById('status-message');

        status.textContent = '🎨 Rendering visual...';
        document.getElementById('preview-section').classList.add('hidden');

        if (isAi) {
            const prompt = document.getElementById('theme').value;
            const seed = Math.floor(Math.random() * 1000000);
            imgEl.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=384&seed=${seed}&nologo=true`;
            imgEl.onload = () => {
                status.textContent = '';
                document.getElementById('preview-section').classList.remove('hidden');
            };
        } else {
            if (!loadedUserImage) {
                status.textContent = '❌ Please select an image first.';
                return;
            }
            const resultDataUrl = processPhotoToArt(document.getElementById('artStyleSelect').value);
            imgEl.src = resultDataUrl;
            imgEl.onload = () => {
                status.textContent = '';
                document.getElementById('preview-section').classList.remove('hidden');
            };
        }
    }

    function updateSendFormUI() {
        const checkEmail = document.getElementById('checkEmail');
        const checkText = document.getElementById('checkText');
        const checkWhatsapp = document.getElementById('checkWhatsapp');
        
        document.getElementById('emailGroup').classList.toggle('hidden', !checkEmail.checked);
        document.getElementById('phoneGroup').classList.toggle('hidden', !checkText.checked);
        document.getElementById('whatsappGroup').classList.toggle('hidden', !checkWhatsapp.checked);
        
        document.getElementById('email').required = checkEmail.checked;
        document.getElementById('phone').required = checkText.checked;
        document.getElementById('whatsappPhone').required = checkWhatsapp.checked;
    }

    // Attach required functions to window object
    window.updateSendFormUI = updateSendFormUI;
    window.handleDeviceFileSelect = handleDeviceFileSelect;
    window.toggleImageSourceMode = toggleImageSourceMode;
    window.fetchLiveCountryNews = fetchLiveCountryNews;
    window.handleHeadlineChange = handleHeadlineChange;
    window.generatePostcardVisual = generatePostcardVisual;
</script>
