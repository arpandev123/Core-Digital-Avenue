<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Postcard Generator with Live Trends</title>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <style>
        :root {
            --primary-color: #F7DC6F; 
            --primary-hover: #F4D03F;
            --background-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h2 { margin-top: 0; color: #D4AC0D; }
        p { font-size: 0.9em; color: #666; margin-bottom: 20px; }

        /* --- LIVE TRENDING TICKER STYLES --- */
        .trending-box {
            background: #fffdf0;
            border: 1px solid #f9e79f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        .trending-header {
            font-size: 0.8em;
            font-weight: bold;
            color: #b7950b;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .trend-snippet {
            font-size: 0.85em;
            color: #555;
            margin-bottom: 10px;
            font-style: italic;
            min-height: 35px;
        }

        .trend-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .trend-chip {
            background: #fef9e7;
            border: 1px solid #f7dc6f;
            color: #7d6608;
            padding: 4px 8px;
            font-size: 0.75em;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .trend-chip:hover {
            background: #f4d03f;
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }

        input:focus { border-color: var(--primary-color); outline: none; }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: #333333; 
            border: none;
            padding: 14px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #FCF3CF; color: #999; cursor: not-allowed; }

        #preview-section {
            display: none; 
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed #ddd;
        }

        .postcard-preview {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .postcard-preview img {
            width: 100%; height: auto; display: block;
            background-color: #eee; min-height: 250px;
        }

        .checkbox-group {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 20px;
            background: #fffdf5;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #f2e29e;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            margin: 0;
            font-size: 0.85em;
        }

        .checkbox-group input {
            margin-right: 5px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #D4AC0D;
        }

        .hidden { display: none !important; }
        #status-message { margin-top: 20px; font-weight: bold; font-size: 0.9em; min-height: 20px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .loading { color: #D4AC0D; }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Postcard Creator</h2>
        <p>Pick a live online trend below or type your own theme!</p>

        <!-- Live Online Trending News Ticker Box -->
        <div class="trending-box">
            <div class="trending-header">
                <span>🔥 Live Online Trends</span>
                <span id="trend-status">Fetching live feed...</span>
            </div>
            <div class="trend-snippet" id="trend-snippet-text">
                Connecting to live global RSS feeds...
            </div>
            <div class="trend-chips" id="trend-chips-container">
                <!-- Dynamically injected live trend buttons -->
            </div>
        </div>

        <!-- Step 1: Generate Postcard -->
        <form id="generateForm">
            <div class="form-group">
                <label for="theme">Postcard Theme / Auto-Prompt</label>
                <input type="text" id="theme" placeholder="Select a live trend above or type custom theme" required>
            </div>
            <button type="submit" id="generateBtn">Generate Postcard</button>
        </form>

        <div id="status-message"></div>

        <!-- Step 2: Preview & Send -->
        <div id="preview-section">
            <h3>Your Postcard Preview</h3>
            
            <div class="postcard-preview">
                <img id="generated-image" src="" alt="Generated Postcard Art">
            </div>

            <p style="margin-bottom: 15px; font-weight: bold;">How would you like to share this?</p>

            <form id="sendForm">
                <div class="checkbox-group">
                    <label><input type="checkbox" id="checkEmail" checked> 📧 Email</label>
                    <label><input type="checkbox" id="checkText"> 📱 SMS</label>
                    <label><input type="checkbox" id="checkWhatsapp"> 💬 WhatsApp</label>
                </div>

                <div class="form-group" id="emailGroup">
                    <label for="email">Recipient's Email</label>
                    <input type="email" id="email" placeholder="friend@example.com">
                </div>

                <div class="form-group hidden" id="phoneGroup">
                    <label for="phone">Recipient's Phone (SMS)</label>
                    <input type="tel" id="phone" placeholder="e.g. 0412 345 678">
                </div>

                <div class="form-group hidden" id="whatsappGroup">
                    <label for="whatsappPhone">Recipient's WhatsApp Number</label>
                    <input type="tel" id="whatsappPhone" placeholder="e.g. +61412345678">
                </div>

                <button type="submit" id="sendBtn">Send Postcard</button>
            </form>
        </div>
    </div>

    <script>
        // Fetch Live Trends Online via Public RSS-to-JSON API
        async function fetchLiveTrends() {
            const statusSpan = document.getElementById('trend-status');
            const snippetBox = document.getElementById('trend-snippet-text');
            const chipsContainer = document.getElementById('trend-chips-container');

            try {
                // Using Google News RSS feed converted to clean JSON via rss2json public endpoint
                const rssUrl = "https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en";
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    statusSpan.textContent = 'Live ✔';
                    chipsContainer.innerHTML = '';

                    // Grab top 5 live articles/trends
                    const liveTrends = data.items.slice(0, 5);

                    // Show snippet of the first trend by default
                    snippetBox.textContent = `"${liveTrends[0].title}"`;

                    liveTrends.forEach(item => {
                        // Create a short chip label from the title words
                        const words = item.title.split(' ').slice(0, 3).join('0'); // short handle
                        const cleanTitle = item.title.replace(/(&amp;|&quot;|&#39;)/g, '');
                        
                        const chip = document.createElement('div');
                        chip.className = 'trend-chip';
                        // Keep text badge concise
                        chip.textContent = `# ${item.title.split(' - ')[0].substring(0, 25)}...`;
                        
                        chip.onclick = () => {
                            // Automatically turn headline into an AI art prompt style
                            document.getElementById('theme').value = `An artistic postcard interpretation of: ${cleanTitle}`;
                            snippetBox.textContent = `"${cleanTitle}"`;
                            
                            // Auto trigger generation
                            document.getElementById('generateForm').requestSubmit();
                        };
                        chipsContainer.appendChild(chip);
                    });
                } else {
                    throw new Error('No items found');
                }
            } catch (error) {
                console.error("Error fetching live trends:", error);
                statusSpan.textContent = 'Using Fallback';
                snippetBox.textContent = `"Exploring modern technological marvels and global infrastructure innovations."`;
                
                // Fallback live topics if offline or network blocks public RSS proxy
                chipsContainer.innerHTML = `
                    <div class="trend-chip" onclick="setFallbackPrompt('Global Renewable Energy Expansion')"># Renewable Energy</div>
                    <div class="trend-chip" onclick="setFallbackPrompt('Deep Sea Exploration Discoveries')"># Deep Sea Tech</div>
                    <div class="trend-chip" onclick="setFallbackPrompt('Futuristic High Speed Rail Networks')"># High Speed Rail</div>
                `;
            }
        }

        function setFallbackPrompt(topic) {
            document.getElementById('theme').value = `An artistic postcard representation of ${topic}`;
            document.getElementById('trend-snippet-text').textContent = `Trending online topic: ${topic}`;
            document.getElementById('generateForm').requestSubmit();
        }

        // Run fetch on page load
        window.addEventListener('DOMContentLoaded', fetchLiveTrends);

        // Standard App Logic
        const generateForm = document.getElementById('generateForm');
        const sendForm = document.getElementById('sendForm');
        const previewSection = document.getElementById('preview-section');
        const statusMessage = document.getElementById('status-message');
        
        const checkEmail = document.getElementById('checkEmail');
        const checkText = document.getElementById('checkText');
        const checkWhatsapp = document.getElementById('checkWhatsapp');
        
        const emailGroup = document.getElementById('emailGroup');
        const phoneGroup = document.getElementById('phoneGroup');
        const whatsappGroup = document.getElementById('whatsappGroup');
        
        const sendBtn = document.getElementById('sendBtn');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const whatsappInput = document.getElementById('whatsappPhone');

        let currentTheme = "";

        function updateFormUI() {
            emailGroup.classList.toggle('hidden', !checkEmail.checked);
            phoneGroup.classList.toggle('hidden', !checkText.checked);
            whatsappGroup.classList.toggle('hidden', !checkWhatsapp.checked);
            
            emailInput.required = checkEmail.checked;
            phoneInput.required = checkText.checked;
            whatsappInput.required = checkWhatsapp.checked;
            
            const activeCount = [checkEmail.checked, checkText.checked, checkWhatsapp.checked].filter(Boolean).length;
            
            if (activeCount === 0) {
                sendBtn.textContent = 'Select an option above';
                sendBtn.disabled = true;
            } else if (activeCount > 1) {
                sendBtn.textContent = 'Send via Multiple Channels';
                sendBtn.disabled = false;
            } else {
                if (checkEmail.checked) sendBtn.textContent = 'Send Email';
                if (checkText.checked) sendBtn.textContent = 'Send SMS';
                if (checkWhatsapp.checked) sendBtn.textContent = 'Share via WhatsApp';
                sendBtn.disabled = false;
            }
        }

        checkEmail.addEventListener('change', updateFormUI);
        checkText.addEventListener('change', updateFormUI);
        checkWhatsapp.addEventListener('change', updateFormUI);

        generateForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            currentTheme = document.getElementById('theme').value;
            const generateBtn = document.getElementById('generateBtn');

            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating Art...';
            statusMessage.className = 'loading';
            statusMessage.textContent = '🎨 Painting based on live online trend...';
            previewSection.style.display = 'none';

            try {
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(currentTheme + " postcard illustration")}?width=400&height=300&nologo=true`;
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                document.getElementById('generated-image').src = imageUrl;

                document.getElementById('generated-image').onload = () => {
                    statusMessage.textContent = '';
                    previewSection.style.display = 'block';
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate New Postcard';
                };
            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Failed to generate postcard.';
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Postcard';
            }
        });

        sendForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            sendBtn.disabled = true;
            sendBtn.textContent = 'Processing...';
            statusMessage.className = 'loading';
            
            const imageUrl = document.getElementById('generated-image').src;
            let successMessage = "";
            let whatsappUrlToOpen = null;
            let smsUrlToOpen = null;

            try {
                if (checkEmail.checked) {
                    statusMessage.textContent = '✉️ Delivering email...';
                    emailjs.init("nERbog0CqlvyZi4UE");
                    await emailjs.send("service_kmmyfad", "template_wcnazr9", {
                        to_email: emailInput.value,
                        theme: currentTheme,
                        image_url: imageUrl
                    });
                    successMessage += `✨ Email sent! `;
                }

                if (checkText.checked) {
                    const phone = phoneInput.value;
                    const smsBody = `Check out this trending postcard about "${currentTheme}"! View it here: ${imageUrl}`;
                    smsUrlToOpen = `sms:${phone}?body=${encodeURIComponent(smsBody)}`;
                    successMessage += `📱 SMS app opened! `;
                }

                if (checkWhatsapp.checked) {
                    const waPhone = whatsappInput.value.replace(/\D/g,'');
                    whatsappUrlToOpen = `https://api.whatsapp.com/send?phone=${waPhone}&text=${encodeURIComponent(imageUrl)}`;
                    successMessage += `💬 WhatsApp ready! `;
                }

                statusMessage.className = 'success';
                statusMessage.textContent = successMessage || 'Success!';
                
                if (smsUrlToOpen) {
                    setTimeout(() => { window.location.href = smsUrlToOpen; }, 400);
                }
                if (whatsappUrlToOpen) {
                    setTimeout(() => { window.open(whatsappUrlToOpen, '_blank'); }, 800);
                }

                setTimeout(() => {
                    sendForm.reset();
                    updateFormUI();
                    previewSection.style.display = 'none';
                    document.getElementById('theme').value = '';
                    statusMessage.textContent = '';
                }, 4000);

            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Something went wrong. Check your settings.';
                console.error(error);
                updateFormUI();
            }
        });
    </script>
</body>
</html>
