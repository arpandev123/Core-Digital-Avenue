<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Postcard Generator</title>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <style>
        :root {
            /* Light Yellow Theme */
            --primary-color: #F7DC6F; 
            --primary-hover: #F4D03F;
            --background-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #D4AC0D;
        }

        p {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: #333333; 
            border: none;
            padding: 14px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #FCF3CF; color: #999; cursor: not-allowed; }

        /* Postcard Preview Styles */
        #preview-section {
            display: none; 
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed #ddd;
        }

        .postcard-preview {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .postcard-preview img {
            width: 100%;
            height: auto;
            display: block;
            background-color: #eee;
            min-height: 250px;
        }

        .postcard-text {
            padding: 20px;
            font-style: italic;
            color: #444;
            background-image: repeating-linear-gradient(transparent, transparent 29px, #eee 30px);
            line-height: 30px;
            text-align: left;
        }

        #status-message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 0.9em;
            min-height: 20px;
        }

        .success { color: #28a745; }
        .error { color: #dc3545; }
        .loading { color: #D4AC0D; }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Postcard Creator</h2>
        <p>Step 1: Enter a theme to generate your postcard artwork and message.</p>

        <!-- Step 1: Generate Postcard -->
        <form id="generateForm">
            <div class="form-group">
                <label for="theme">Postcard Theme</label>
                <input type="text" id="theme" placeholder="e.g., A futuristic city at sunset" required>
            </div>
            <button type="submit" id="generateBtn">Generate Postcard</button>
        </form>

        <div id="status-message"></div>

        <!-- Step 2: Preview & Send -->
        <div id="preview-section">
            <h3>Your Postcard Preview</h3>
            
            <div class="postcard-preview">
                <img id="generated-image" src="" alt="Generated Postcard Art">
                <div class="postcard-text" id="generated-text">
                    <!-- Text goes here -->
                </div>
            </div>

            <p style="margin-bottom: 15px; font-weight: bold;">Looks good? Send it now!</p>

            <form id="sendForm">
                <div class="form-group">
                    <label for="email">Recipient's Email</label>
                    <input type="email" id="email" placeholder="friend@example.com" required>
                </div>
                <button type="submit" id="sendBtn">Send Postcard</button>
            </form>
        </div>
    </div>

    <script>
        const generateForm = document.getElementById('generateForm');
        const sendForm = document.getElementById('sendForm');
        const previewSection = document.getElementById('preview-section');
        const statusMessage = document.getElementById('status-message');
        
        let currentTheme = "";

        // Step 1: Generate the Preview
        generateForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            currentTheme = document.getElementById('theme').value;
            const generateBtn = document.getElementById('generateBtn');

            // UI Loading state
            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating Art & Text...';
            statusMessage.className = 'loading';
            statusMessage.textContent = '🎨 Painting your masterpiece...';
            previewSection.style.display = 'none';

            try {
                // Free, public AI image generator URL for the demo
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(currentTheme + " postcard illustration")}?width=400&height=300&nologo=true`;
                
                // Simulate delay for text generation
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Mock generated text based on the theme
                const mockGeneratedText = `Greetings! I hope this postcard finds you well. I couldn't resist sending you this beautiful view of ${currentTheme}. Wish you were here to see it!`;

                // Update the DOM with generated content
                document.getElementById('generated-image').src = imageUrl;
                document.getElementById('generated-text').textContent = mockGeneratedText;

                // Wait for image to load before showing preview
                document.getElementById('generated-image').onload = () => {
                    statusMessage.textContent = '';
                    previewSection.style.display = 'block';
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate New Postcard';
                };

            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Failed to generate postcard.';
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Postcard';
            }
        });

        // Step 2: Send the Postcard via EmailJS
        sendForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const sendBtn = document.getElementById('sendBtn');

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            statusMessage.className = 'loading';
            statusMessage.textContent = '✉️ Delivering your postcard...';

            try {
                // 1. Initialize EmailJS with your Public Key
                // REPLACE THIS STRING WITH YOUR ACTUAL PUBLIC KEY
                emailjs.init("nERbog0CqlvyZi4UE");

                const imageUrl = document.getElementById('generated-image').src;

                // 2. Prepare the data to match your EmailJS template variables
                const templateParams = {
                    to_email: email,
                    theme: currentTheme,
                    image_url: imageUrl
                };

                // 3. Send using EmailJS 
                // REPLACE THESE STRINGS WITH YOUR ACTUAL SERVICE ID AND TEMPLATE ID
                await emailjs.send(
                    "service_kmmyfad",   
                    "template_wcnazr9",  
                    templateParams
                );

                statusMessage.className = 'success';
                statusMessage.textContent = `✨ Success! Your postcard was delivered to ${email}!`;
                
                // Reset form
                sendForm.reset();
                setTimeout(() => {
                    previewSection.style.display = 'none';
                    document.getElementById('theme').value = '';
                    statusMessage.textContent = '';
                    document.getElementById('generateBtn').textContent = 'Generate Postcard';
                }, 4000);

            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Failed to send email. Check your EmailJS keys and setup.';
                console.error(error);
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Postcard';
            }
        });
    </script>
</body>
</html>
