<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Postcard Generator with Live Trends</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <style>
        :root {
            --primary-color: #F7DC6F; 
            --primary-hover: #F4D03F;
            --background-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h2 { margin-top: 0; color: #D4AC0D; }
        p { font-size: 0.9em; color: #666; margin-bottom: 20px; }

        /* --- TRENDING NEWS TICKER STYLES --- */
        .trending-box {
            background: #fffdf0;
            border: 1px solid #f9e79f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        .trending-header {
            font-size: 0.8em;
            font-weight: bold;
            color: #b7950b;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .trend-snippet {
            font-size: 0.85em;
            color: #555;
            margin-bottom: 10px;
            font-style: italic;
        }

        .trend-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .trend-chip {
            background: #fef9e7;
            border: 1px solid #f7dc6f;
            color: #7d6608;
            padding: 4px 8px;
            font-size: 0.75em;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .trend-chip:hover {
            background: #f4d03f;
            color: #fff;
        }
        ------------------------------------

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }

        input:focus { border-color: var(--primary-color); outline: none; }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: #333333; 
            border: none;
            padding: 14px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #FCF3CF; color: #999; cursor: not-allowed; }

        #preview-section {
            display: none; 
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed #ddd;
        }

        .postcard-preview {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .postcard-preview img {
            width: 100%; height: auto; display: block;
            background-color: #eee; min-height: 250px;
        }

        .checkbox-group {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 20px;
            background: #fffdf5;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #f2e29e;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            margin: 0;
            font-size: 0.85em;
        }

        .checkbox-group input {
            margin-right: 5px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #D4AC0D;
        }

        .hidden { display: none !important; }
        #status-message { margin-top: 20px; font-weight: bold; font-size: 0.9em; min-height: 20px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .loading { color: #D4AC0D; }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Postcard Creator</h2>
        <p>Pick a trending social topic below or type your own theme!</p>

        <div class="trending-box">
            <div class="trending-header">
                <span>🔥 Live Social Trends</span>
                <span id="trend-time">Just now</span>
            </div>
            <div class="trend-snippet" id="trend-snippet-text">
                Loading current social pulse...
            </div>
            <div class="trend-chips" id="trend-chips-container">
                </div>
        </div>

        <form id="generateForm">
            <div class="form-group">
                <label for="theme">Postcard Theme / Auto-Prompt</label>
                <input type="text" id="theme" placeholder="Click a trend above or type custom theme" required>
            </div>
            <button type="submit" id="generateBtn">Generate Postcard</button>
        </form>

        <div id="status-message"></div>

        <div id="preview-section">
            <h3>Your Postcard Preview</h3>
            
            <div class="postcard-preview">
                <img id="generated-image" src="" alt="Generated Postcard Art">
            </div>

            <p style="margin-bottom: 15px; font-weight: bold;">How would you like to share this?</p>

            <form id="sendForm">
                <div class="checkbox-group">
                    <label><input type="checkbox" id="checkEmail" checked> 📧 Email</label>
                    <label><input type="checkbox" id="checkText"> 📱 SMS</label>
                    <label><input type="checkbox" id="checkWhatsapp"> 💬 WhatsApp</label>
                </div>

                <div class="form-group" id="emailGroup">
                    <label for="email">Recipient's Email</label>
                    <input type="email" id="email" placeholder="friend@example.com">
                </div>

                <div class="form-group hidden" id="phoneGroup">
                    <label for="phone">Recipient's Phone (SMS)</label>
                    <input type="tel" id="phone" placeholder="e.g. 0412 345 678">
                </div>

                <div class="form-group hidden" id="whatsappGroup">
                    <label for="whatsappPhone">Recipient's WhatsApp Number</label>
                    <input type="tel" id="whatsappPhone" placeholder="e.g. +61412345678">
                </div>

                <button type="submit" id="sendBtn">Send Postcard</button>
            </form>
        </div>
    </div>

    <script>
        // Simulated or Live Trending Feed Data (Can be linked to an RSS/News API)
        const trendingTopics = [
            {
                tag: "Northern Lights Spectacle",
                prompt: "A breathtaking vibrant display of the Aurora Borealis over a snowy mountain cabin",
                snippet: "Social feeds are flooded with rare multi-color aurora sightings visible across unusual latitudes last night."
            },
            {
                tag: "Bioluminescent Beach",
                prompt: "Glowing blue waves crashing softly onto a tranquil tropical sandy shore at midnight",
                snippet: "Viral videos show glowing plankton lighting up coastlines, inspiring dream getaway posts."
            },
            {
                tag: "Retro Futuristic City",
                prompt: "A retro-futuristic 1980s synthwave cityscape with neon lights and flying cars at dusk",
                snippet: "Nostalgic synthwave aesthetics are trending heavily across design and art communities today."
            },
            {
                tag: "Cozy Autumn Cabin",
                prompt: "A cozy wooden cabin nestled in a dense orange autumn forest with smoke rising from the chimney",
                snippet: "Users are sharing aesthetic mood boards focusing on slow living and crisp weather vibes."
            }
        ];

        // Load Trends into UI
        function loadTrends() {
            const container = document.getElementById('trend-chips-container');
            const snippetBox = document.getElementById('trend-snippet-text');
            container.innerHTML = '';

            // Pick a random trend snippet to display initially
            const randomTrend = trendingTopics[Math.floor(Math.random() * trendingTopics.length)];
            snippetBox.textContent = `"${randomTrend.snippet}"`;

            trendingTopics.forEach(item => {
                const chip = document.createElement('div');
                chip.className = 'trend-chip';
                chip.textContent = `# ${item.tag}`;
                chip.onclick = () => {
                    // Auto-fill the theme box and snippet info
                    document.getElementById('theme').value = item.prompt;
                    snippetBox.textContent = `"${item.snippet}"`;
                    // Optional: auto-trigger generation immediately
                    document.getElementById('generateForm').requestSubmit();
                };
                container.appendChild(chip);
            });
        }

        // Initialize trends on page load
        window.addEventListener('DOMContentLoaded', loadTrends);

        // Standard App Elements
        const generateForm = document.getElementById('generateForm');
        const sendForm = document.getElementById('sendForm');
        const previewSection = document.getElementById('preview-section');
        const statusMessage = document.getElementById('status-message');
        
        const checkEmail = document.getElementById('checkEmail');
        const checkText = document.getElementById('checkText');
        const checkWhatsapp = document.getElementById('checkWhatsapp');
        
        const emailGroup = document.getElementById('emailGroup');
        const phoneGroup = document.getElementById('phoneGroup');
        const whatsappGroup = document.getElementById('whatsappGroup');
        
        const sendBtn = document.getElementById('sendBtn');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const whatsappInput = document.getElementById('whatsappPhone');

        let currentTheme = "";

        function updateFormUI() {
            emailGroup.classList.toggle('hidden', !checkEmail.checked);
            phoneGroup.classList.toggle('hidden', !checkText.checked);
            whatsappGroup.classList.toggle('hidden', !checkWhatsapp.checked);
            
            emailInput.required = checkEmail.checked;
            phoneInput.required = checkText.checked;
            whatsappInput.required = checkWhatsapp.checked;
            
            const activeCount = [checkEmail.checked, checkText.checked, checkWhatsapp.checked].filter(Boolean).length;
            
            if (activeCount === 0) {
                sendBtn.textContent = 'Select an option above';
                sendBtn.disabled = true;
            } else if (activeCount > 1) {
                sendBtn.textContent = 'Send via Multiple Channels';
                sendBtn.disabled = false;
            } else {
                if (checkEmail.checked) sendBtn.textContent = 'Send Email';
                if (checkText.checked) sendBtn.textContent = 'Send SMS';
                if (checkWhatsapp.checked) sendBtn.textContent = 'Share via WhatsApp';
                sendBtn.disabled = false;
            }
        }

        checkEmail.addEventListener('change', updateFormUI);
        checkText.addEventListener('change', updateFormUI);
        checkWhatsapp.addEventListener('change', updateFormUI);

        generateForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            currentTheme = document.getElementById('theme').value;
            const generateBtn = document.getElementById('generateBtn');

            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating Art...';
            statusMessage.className = 'loading';
            statusMessage.textContent = '🎨 Painting based on current social trend...';
            previewSection.style.display = 'none';

            try {
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(currentTheme + " postcard illustration")}?width=400&height=300&nologo=true`;
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                document.getElementById('generated-image').src = imageUrl;

                document.getElementById('generated-image').onload = () => {
                    statusMessage.textContent = '';
                    previewSection.style.display = 'block';
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate New Postcard';
                };
            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Failed to generate postcard.';
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Postcard';
            }
        });

        sendForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            sendBtn.disabled = true;
            sendBtn.textContent = 'Processing...';
            statusMessage.className = 'loading';
            
            const imageUrl = document.getElementById('generated-image').src;
            let successMessage = "";
            let whatsappUrlToOpen = null;
            let smsUrlToOpen = null;

            try {
                if (checkEmail.checked) {
                    statusMessage.textContent = '✉️ Delivering email...';
                    emailjs.init("nERbog0CqlvyZi4UE");
                    await emailjs.send("service_kmmyfad", "template_wcnazr9", {
                        to_email: emailInput.value,
                        theme: currentTheme,
                        image_url: imageUrl
                    });
                    successMessage += `✨ Email sent! `;
                }

                if (checkText.checked) {
                    const phone = phoneInput.value;
                    const smsBody = `Check out this trending postcard about "${currentTheme}"! View it here: ${imageUrl}`;
                    smsUrlToOpen = `sms:${phone}?body=${encodeURIComponent(smsBody)}`;
                    successMessage += `📱 SMS app opened! `;
                }

                if (checkWhatsapp.checked) {
                    const waPhone = whatsappInput.value.replace(/\D/g,'');
                    whatsappUrlToOpen = `https://api.whatsapp.com/send?phone=${waPhone}&text=${encodeURIComponent(imageUrl)}`;
                    successMessage += `💬 WhatsApp ready! `;
                }

                statusMessage.className = 'success';
                statusMessage.textContent = successMessage || 'Success!';
                
                if (smsUrlToOpen) {
                    setTimeout(() => { window.location.href = smsUrlToOpen; }, 400);
                }
                if (whatsappUrlToOpen) {
                    setTimeout(() => { window.open(whatsappUrlToOpen, '_blank'); }, 800);
                }

                setTimeout(() => {
                    sendForm.reset();
                    updateFormUI();
                    previewSection.style.display = 'none';
                    document.getElementById('theme').value = '';
                    statusMessage.textContent = '';
                }, 4000);

            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = '❌ Something went wrong. Check your settings.';
                console.error(error);
                updateFormUI();
            }
        });
    </script>
</body>
</html>
